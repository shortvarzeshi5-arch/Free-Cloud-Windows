name: Windows Cloud RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 1. Enable Remote Desktop & Firewall
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0

      - name: 2. Create Admin Account
        run: |
          $Password = ConvertTo-SecureString "Cynet@2026" -AsPlainText -Force
          New-LocalUser -Name "CynetAdmin" -Password $Password -PasswordNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "CynetAdmin" -ErrorAction SilentlyContinue
          net user runneradmin Cynet@2026

      - name: 3. Start Tunnel via Serveo & Print Address
        run: |
          # Start Serveo TCP tunnel - no install, no signup, no credit card needed!
          Start-Process ssh -ArgumentList "-o StrictHostKeyChecking=no -o ServerAliveInterval=30 -R 0:localhost:3389 serveo.net" `
            -RedirectStandardOutput C:\serveo.log `
            -RedirectStandardError C:\serveo_err.log
          
          # Wait for tunnel to establish
          Start-Sleep -Seconds 10
          
          # Read from both stdout and stderr
          $out = Get-Content C:\serveo.log -Raw -ErrorAction SilentlyContinue
          $err = Get-Content C:\serveo_err.log -Raw -ErrorAction SilentlyContinue
          $combined = "$out $err"
          
          Write-Host "--- Raw Output ---"
          Write-Host $combined
          
          # Extract port number from serveo output
          if ($combined -match 'serveo.net:(\d+)') {
              $port = $matches[1]
              Write-Host ""
              Write-Host "==================================================" -ForegroundColor Green
              Write-Host "   >>> RDP SERVER IS READY! <<<" -ForegroundColor Cyan
              Write-Host "   Address  : serveo.net:$port" -ForegroundColor Yellow
              Write-Host "   Username : CynetAdmin" -ForegroundColor Yellow
              Write-Host "   Password : Cynet@2026" -ForegroundColor Yellow
              Write-Host "==================================================" -ForegroundColor Green
          } else {
              Write-Host "Tunnel output not matched yet. Check raw output above." -ForegroundColor Red
          }

      - name: 4. Keep Server Alive (6 Hours)
        run: |
          for ($i = 1; $i -le 360; $i++) {
            Start-Sleep -Seconds 60
            Write-Host "[$i/360] Server running..."
          }
