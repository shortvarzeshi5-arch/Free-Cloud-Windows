name: Windows Cloud RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 1. Install Bore Tunnel
        run: |
          Invoke-WebRequest https://github.com/ekzhang/bore/releases/download/v0.5.1/bore-v0.5.1-x86_64-pc-windows-msvc.zip -OutFile C:\bore.zip
          Expand-Archive C:\bore.zip -DestinationPath C:\Windows -Force
          Remove-Item C:\bore.zip

      - name: 2. Enable Remote Desktop & Firewall
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0

      - name: 3. Create Windows Administrator Account
        run: |
          $Password = ConvertTo-SecureString "Cynet@2026" -AsPlainText -Force
          New-LocalUser -Name "CynetAdmin" -Password $Password -PasswordNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "CynetAdmin" -ErrorAction SilentlyContinue
          net user runneradmin Cynet@2026

      - name: 4. Start Tunnel & Get RDP Address
        run: |
          Start-Process bore -ArgumentList "local 3389 --to bore.pub" -RedirectStandardOutput C:\bore.log -RedirectStandardError C:\bore_err.log
          
          Start-Sleep -Seconds 6
          
          $log = Get-Content C:\bore.log -Raw -ErrorAction SilentlyContinue
          if ($log -match 'bore.pub:([0-9]+)') {
              $port = $matches[1]
              $rdp_address = "bore.pub:$port"
              
              Write-Host ""
              Write-Host "==================================================" -ForegroundColor Green
              Write-Host "  >>> RDP SERVER IS LIVE & READY! <<<" -ForegroundColor Cyan
              Write-Host "  Address  : $rdp_address" -ForegroundColor Yellow
              Write-Host "  Username : CynetAdmin" -ForegroundColor Yellow
              Write-Host "  Password : Cynet@2026" -ForegroundColor Yellow
              Write-Host "==================================================" -ForegroundColor Green
              Write-Host ""
          } else {
              Write-Host "--- BORE LOG ---" -ForegroundColor Yellow
              Write-Host $log
              Write-Host "--- ERROR LOG ---" -ForegroundColor Red
              Get-Content C:\bore_err.log -Raw -ErrorAction SilentlyContinue
          }

      - name: 5. Keep Server Alive (6 Hours)
        run: |
          for ($i = 1; $i -le 360; $i++) {
            Start-Sleep -Seconds 60
            Write-Host "Server is active... [$i / 360 minutes]"
          }
